[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiheaddev"
version = "0.1.0"
description = "Autonomous AI-driven orchestration cockpit and terminal user interface for Herdr-Master"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Panagiotis Kalaitzis" }
]
keywords = [
    "aiheaddev",
    "herdr",
    "herdr-master",
    "cockpit",
    "tui",
    "terminal",
    "agent-orchestration",
    "textual"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Terminals",
]
dependencies = [
    "herdr-master>=0.1.0",
    "textual>=8.0.0",
    "rich>=13.7.0",
    "pyte>=0.8.2",
    "pydantic>=2.6.0",
    "tomli>=2.0.1;python_version<'3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
aiheaddev = "aiheaddev.cli:main"
aihead = "aiheaddev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiheaddev"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
