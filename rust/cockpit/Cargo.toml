[package]
name = "aihead-cockpit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"

[lib]
name = "aihead_cockpit"
path = "src/lib.rs"

[[bin]]
name = "aihead-cockpit"
path = "src/main.rs"

[dependencies]
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "=0.2.0"
